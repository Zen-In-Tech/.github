name: Question
description: Ask about the project, a feature or how something works.
labels: ["question", "needs-triage"]
type: Question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you are trying to do, links, screenshots.
  - type: input
    id: needed-by
    attributes:
      label: Answer needed by
      placeholder: "2026-11-20"
